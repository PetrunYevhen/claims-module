name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: webapp-claims-module-api
  DOTNET_VERSION: "9.0.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/ClaimsModule.sln

      - name: Build
        run: dotnet build backend/ClaimsModule.sln -c Release --no-restore

      - name: Publish API
        run: dotnet publish backend/src/ClaimsModule.API/ClaimsModule.API.csproj -c Release -o ${{ github.workspace }}/publish --no-build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish

name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: webapp-claims-module-api
  DOTNET_VERSION: "9.0.x"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/ClaimsModule.sln

      - name: Build
        run: dotnet build backend/ClaimsModule.sln -c Release --no-restore

      - name: Test
        run: dotnet test backend/ClaimsModule.sln -c Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish backend/src/ClaimsModule.API/ClaimsModule.API.csproj -c Release -o ${{ github.workspace }}/publish --no-build

      # Basic Auth publishing credentials are disabled on the App Service (Azure's default for
      # new sites), so a static publish-profile secret isn't an option - authenticate via OIDC
      # federated credentials instead (no long-lived secret to store or leak).
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/publish

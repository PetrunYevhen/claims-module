<h2 mat-dialog-title>Add Party</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <div class="field-row">
      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select formControlName="partyRole">
          @for (role of partyRoles; track role) {
            <mat-option [value]="role">{{ role }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Type</mat-label>
        <mat-select formControlName="partyType">
          <mat-option value="Person">Person</mat-option>
          <mat-option value="Company">Company</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    @if (form.controls.partyType.value === 'Person') {
      <div class="field-row">
        <mat-form-field appearance="outline">
          <mat-label>First name</mat-label>
          <input matInput formControlName="firstName" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Last name</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>
      </div>
    } @else {
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Company name</mat-label>
        <input matInput formControlName="companyName" />
      </mat-form-field>
    }

    <div class="field-row">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()">Add</button>
</mat-dialog-actions>

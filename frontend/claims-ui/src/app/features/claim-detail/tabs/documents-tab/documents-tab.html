<div class="tab-content">
  <div class="section-header">
    <h2>Documents</h2>
    <input
      #fileInput
      type="file"
      hidden
      (change)="onFileSelected($event)"
      accept=".pdf,.jpg,.jpeg,.png,.docx,.xlsx,.txt,.csv"
    />
    <button mat-stroked-button type="button" [disabled]="uploading()" (click)="fileInput.click()">
      @if (uploading()) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        <mat-icon>upload</mat-icon>
      }
      Upload Document
    </button>
  </div>

  @if (loading()) {
    <mat-spinner diameter="32"></mat-spinner>
  } @else if (documents().length === 0) {
    <p class="muted">No documents uploaded yet.</p>
  } @else {
    <table mat-table [dataSource]="documents()" class="documents-table">
      <ng-container matColumnDef="documentName">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let doc">{{ doc.documentName }}</td>
      </ng-container>

      <ng-container matColumnDef="documentType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let doc">{{ doc.documentType }}</td>
      </ng-container>

      <ng-container matColumnDef="uploadedAt">
        <th mat-header-cell *matHeaderCellDef>Uploaded</th>
        <td mat-cell *matCellDef="let doc">{{ doc.uploadedAt | date: 'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="fileSizeBytes">
        <th mat-header-cell *matHeaderCellDef>Size</th>
        <td mat-cell *matCellDef="let doc">{{ formatSize(doc.fileSizeBytes) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let doc">
          <button mat-button color="primary" (click)="download(doc)">
            <mat-icon>download</mat-icon>
            Download
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</div>
